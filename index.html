<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portfólio de Nicolas de Sousa, desenvolvedor full stack e estudante de Análise e Desenvolvimento de Sistemas." />
    <link rel="icon" type="image/png" href="./imagens/icone.png" />
    <title>Nicolas de Sousa | Desenvolvedor Full Stack</title>
    <script>
      const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = systemTheme;
      try {
        const savedTheme = localStorage.getItem('portfolio-theme');
        if (['light', 'dark'].includes(savedTheme)) document.documentElement.dataset.theme = savedTheme;
      } catch {
        // Keep the system theme if storage is unavailable.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
